name: Tests

on:
  push:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock', 'config.json', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock', 'config.json', '.github/workflows/**']

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --dev
      - run: uv run pytest -q
      - run: uv run aisk --help
