[project]
name = "ai-search-knowledge"
version = "0.1.0"
description = "A local, source-linked knowledge library built from AI Search videos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<1",
  "trafilatura>=2,<3",
  "pypdf>=6,<7",
  "yt-dlp>=2026.8.19",
  "filelock>=3.20,<4",
]

[project.scripts]
aisk = "ai_search_knowledge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_search_knowledge"]

[dependency-groups]
dev = ["pytest>=8,<10"]
